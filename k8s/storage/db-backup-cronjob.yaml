
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  namespace: task-manager
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: task-manager-backup
        spec:
          serviceAccountName: task-manager-app
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: postgres:17
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  export PGPASSWORD="$POSTGRES_PASSWORD"
                  BACKUP_FILE="/backups/taskmanager-$(date +%Y%m%d-%H%M%S).dump"

                  echo "Waiting for database..."
                  until pg_isready -h db -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                    sleep 3
                  done

                  echo "Creating backup: $BACKUP_FILE"
                  pg_dump -h db -p 5432 \
                    -U "$POSTGRES_USER" \
                    -d "$POSTGRES_DB" \
                    -F c -f "$BACKUP_FILE"

                  find /backups -type f -name 'taskmanager-*.dump' -mtime +7 -delete
                  echo "Backup completed successfully."
              env:
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: task-manager-db-secret
                      key: POSTGRES_USER
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: task-manager-db-secret
                      key: POSTGRES_PASSWORD
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: task-manager-db-secret
                      key: POSTGRES_DB
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: db-backup-pvc
