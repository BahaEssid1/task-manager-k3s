
apiVersion: v1
kind: ServiceAccount
metadata:
  name: task-manager-app
  namespace: task-manager
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: task-manager-viewer
  namespace: task-manager
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: task-manager-viewer
  namespace: task-manager
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - persistentvolumeclaims
      - configmaps
      - events
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: task-manager-viewer-binding
  namespace: task-manager
subjects:
  - kind: ServiceAccount
    name: task-manager-viewer
    namespace: task-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: task-manager-viewer
